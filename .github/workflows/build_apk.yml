name: Delivery Pipeline & Build Release APK

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-quality:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/engora_ci
      USE_OPENAI: 'false'
      FEATURE_MODULES_ENABLED: 'false'
      FEATURE_QR_ENABLED: 'false'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.5'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Tests
        run: |
          cd backend
          npm test

  dashboard-quality:
    name: Dashboard Tests, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.5'
          cache: 'npm'
          cache-dependency-path: 'dashboard/package-lock.json'

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm ci --include=optional --legacy-peer-deps

      - name: Run Dashboard Tests
        run: |
          cd dashboard
          npm test

      - name: Run Dashboard Lint
        run: |
          cd dashboard
          npm run lint

      - name: Build Dashboard Production Bundle
        run: |
          cd dashboard
          npm run build

  mobile-quality:
    name: Mobile Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile_beta
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd mobile_beta
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Tests
        run: |
          cd mobile_beta
          flutter test

  build-release-apk:
    name: Build & Package Android Releases
    needs: [backend-quality, dashboard-quality, mobile-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile_beta
          flutter pub get

      - name: Configure Android Release Signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > mobile_beta/android/app/engora-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=engora-release.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            > mobile_beta/android/key.properties

      - name: Build Split Release APKs
        run: |
          cd mobile_beta
          flutter build apk --release --split-per-abi --dart-define=API_BASE_URL=https://api.202-10-37-3.sslip.io

      - name: Build Signed Android App Bundle
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          cd mobile_beta
          flutter build appbundle --release --dart-define=API_BASE_URL=https://api.202-10-37-3.sslip.io

      - name: Name Engora Release Artifacts
        shell: bash
        run: |
          app_version="$(awk '/^version:/ { print $2 }' mobile_beta/pubspec.yaml)"
          version_name="${app_version%%+*}"
          build_number="${app_version##*+}"
          output_dir='mobile_beta/build/app/outputs/flutter-apk'
          cp "$output_dir/app-arm64-v8a-release.apk" "$output_dir/Engora-${version_name}-build${build_number}-arm64.apk"
          cp "$output_dir/app-armeabi-v7a-release.apk" "$output_dir/Engora-${version_name}-build${build_number}-arm32.apk"
          cp "$output_dir/app-x86_64-release.apk" "$output_dir/Engora-${version_name}-build${build_number}-x86_64.apk"
          if [ -f mobile_beta/build/app/outputs/bundle/release/app-release.aab ]; then
            cp mobile_beta/build/app/outputs/bundle/release/app-release.aab \
              "mobile_beta/build/app/outputs/bundle/release/Engora-${version_name}-build${build_number}.aab"
          fi

      - name: Record Build Metadata
        shell: bash
        run: |
          printf 'commit_sha=%s\nworkflow_run=%s\nbuild_time_utc=%s\napi_base_url=%s\nbuild_mode=%s\n' \
            '${{ github.sha }}' \
            '${{ github.run_id }}' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            'https://api.202-10-37-3.sslip.io' \
            'release-split-per-abi' \
            > mobile_beta/build/app/outputs/flutter-apk/build-metadata.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: engora-android-release-${{ github.sha }}
          path: |
            mobile_beta/build/app/outputs/flutter-apk/Engora-*-arm64.apk
            mobile_beta/build/app/outputs/flutter-apk/Engora-*-arm32.apk
            mobile_beta/build/app/outputs/flutter-apk/Engora-*-x86_64.apk
            mobile_beta/build/app/outputs/flutter-apk/build-metadata.txt

      - name: Upload Signed AAB Artifact
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: engora-signed-aab-${{ github.sha }}
          path: mobile_beta/build/app/outputs/bundle/release/Engora-*.aab
